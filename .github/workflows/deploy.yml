# Checks every push and pull request; deploys main to cargoship with pie-delivery. See docs/deploy.md.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: API tests
        run: dotnet test TaskTracker.slnx -c Release

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Web app (type check and build)
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

      - name: Compose file
        run: |
          cp stack/.env.example stack/.env
          printf 'APP_ROOT=/opt/apps/tasktracker\nRELEASE=check\n' >>stack/.env
          (cd stack && docker compose config -q)
          jq -e '.projects == ["stack"]' pie.json

      - name: Image
        run: docker build -t tasktracker:${{ github.sha }} .

      # The image as deployed: a fresh database, the API, and the web app at / and on its own routes.
      - name: Smoke test the image
        run: |
          mkdir -m 777 smoke-data
          docker run -d --name smoke -p 5280:8080 --read-only --tmpfs /tmp \
            -v "$PWD/smoke-data:/data" tasktracker:${{ github.sha }}
          trap 'docker logs smoke' EXIT
          for _ in $(seq 30); do curl -fsS localhost:5280/api/health && break; sleep 1; done
          curl -fsS localhost:5280/api/health
          curl -fsS -X POST localhost:5280/api/cards -H 'Content-Type: application/json' -d '{"title":"Smoke test","status":"todo"}'
          curl -fsS localhost:5280/api/board | grep -q '"title":"Smoke test"'
          curl -fsS localhost:5280/ | grep -q '<div id="root">'
          curl -fsS 'localhost:5280/?card=1' | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:5280/api/nope)" = 404
          test -f smoke-data/tasks.db

      - name: Save the image for the deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save tasktracker:${{ github.sha }} | gzip >image.tar.gz

      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: image
          path: image.tar.gz
          retention-days: 3

  # pie-delivery's Compose action: joins the tailnet (workload identity federation, so no
  # Tailscale secret), rsyncs the bundle to cargoship as `deploy` over Tailscale SSH, and runs
  # pie-deploy there, which loads the image, starts it, checks /api/health and rolls back if not.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-cargoship-tasktracker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: image

      - name: Stage the bundle
        run: |
          mkdir -p bundle/images
          cp -r stack pie.json bundle/
          mv image.tar.gz bundle/images/tasktracker.tar.gz

      - uses: autumnleaves/pie-delivery/compose@91f7b9eb8fb2e918afade15eb5cd0e5ee6a1c0c2 # v2.0.1
        with:
          # Not secrets: the federated identity only accepts GitHub's tokens for autumnleaves repos on main.
          tailscale-oauth-client-id: TEE3HHt6KC11CNTRL-ko1GyqRYiC11CNTRL
          tailscale-audience: api.tailscale.com/TEE3HHt6KC11CNTRL-ko1GyqRYiC11CNTRL
          host: cargoship.tail4ee3b3.ts.net
          app: tasktracker
          bundle: bundle
